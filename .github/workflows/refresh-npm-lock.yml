name: Temporary npm lockfile repair
on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/refresh-npm-lock.yml
permissions:
  contents: write
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate the npm lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the lockfile only if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh npm lockfile for patched TanStack Start"
          git push origin HEAD:main
